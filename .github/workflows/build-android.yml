name: Build ASEL V7 Android APK

on:
  workflow_dispatch:
  push:
    branches: [asel-v7]
    paths:
      - "ASEL_Telegram_Android_IOS/mobile/**"
      - "backend/voice.py"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ASEL V7 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V7 source
        uses: actions/checkout@v4
        with:
          ref: asel-v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        working-directory: ASEL_Telegram_Android_iOS/mobile
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Ensure Internet and microphone permissions
        working-directory: ASEL_Telegram_Android_iOS/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for permission in permissions:
              if permission not in content:
                  content = content.replace('    <application', permission + "\\n    <application", 1)
          manifest.write_text(content)
          print("Internet and microphone permissions configured.")
          PY

      - name: Install Flutter dependencies
        working-directory: ASEL_Telegram_Android_iOS/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: ASEL_Telegram_Android_iOS/mobile
        run: flutter build apk --release

      - name: Upload ASEL V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ASEL-V7-Android-APK
          path: ASEL_Telegram_Android_iOS/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
