name: Build ASEL Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ASEL_Telegram_Android_iOS_v4_memory_calendar.zip"
      - "ASEL_Telegram_Android_iOS/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract ASEL v4 source archive
        run: unzip -o ASEL_Telegram_Android_iOS_v4_memory_calendar.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files if missing
        working-directory: ASEL_Telegram_Android_iOS/mobile
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        working-directory: ASEL_Telegram_Android_iOS/mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: ASEL_Telegram_Android_iOS/mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASEL-v4-Android-APK
          path: ASEL_Telegram_Android_iOS/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
