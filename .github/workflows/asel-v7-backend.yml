name: ASEL V7 backend checks

on:
  push:
    branches: [asel-v7]
    paths:
      - "backend/**"
      - ".github/workflows/asel-v7-backend.yml"
  workflow_dispatch:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asel-v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q .
      - name: Smoke-test SQLite
        env:
          DATABASE_PATH: /tmp/asel-v7-test.sqlite3
        run: python smoke_test_db.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asel-v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Smoke-test PostgreSQL adapter
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asel_test
        run: python smoke_test_db.py
      - name: Smoke-test SQLite to PostgreSQL migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asel_test
        run: python smoke_test_migration.py
